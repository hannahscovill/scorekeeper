game-get:
  get:
    summary: Get a game by ID
    description: |
      Retrieves a game by its ID.
    operationId: getGameById
    tags:
      - Games
    parameters:
      - $ref: '../components/schemas/parameters.yaml#/GameIdPath'
      - $ref: '../components/schemas/parameters.yaml#/TeamIdHeader'
    responses:
      '200':
        $ref: '../components/responses/games.yaml#/GameResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
game-post:
  post:
    summary: Save game
    description: Save a game
    operationId: createGames
    tags:
      - Games
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/models.yaml#/Game'
          examples:
            game_started:
              $ref: '../components/examples/_index.yaml#/GameStarted'
            game_won:
              $ref: '../components/examples/_index.yaml#/GameWon'
    responses:
      '201':
        $ref: '../components/responses/games.yaml#/GameSavedResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequestError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '422':
        $ref: '../components/responses/errors.yaml#/ValidationError'
