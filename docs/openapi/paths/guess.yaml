guess-put:
  put:
    summary: Save a guess
    description: Save a guess for a puzzle
    operationId: saveGuess
    tags:
      - Guesses
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/models.yaml#/GameDomain'
          examples:
            guess_request:
              $ref: '../components/examples/_index.yaml#/GuessRequest'
    responses:
      '200':
        description: Guess saved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/models.yaml#/GuessSavedResponse'
            examples:
              guess_response:
                $ref: '../components/examples/_index.yaml#/GuessResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequestError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '422':
        $ref: '../components/responses/errors.yaml#/ValidationError'
