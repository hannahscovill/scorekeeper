games-by-id:
  get:
    summary: Get a game by ID
    description: |
      Retrieves a specific game by its ID.
    operationId: getGameById
    tags:
      - Games
    parameters:
      - $ref: '../components/schemas/parameters.yaml#/GameIdPath'
      - $ref: '../components/schemas/parameters.yaml#/TeamIdHeader'
    responses:
      '200':
        $ref: '../components/responses/games.yaml#/GameListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'

games:
  post:
    summary: Create games
    description: Create one or more games for the authenticated user
    operationId: createGames
    tags:
      - Games
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/game.yaml#/GameCreateList'
          example:
            - score: 6
    responses:
      '201':
        $ref: '../components/responses/games.yaml#/GameCreatedResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/BadRequestError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '422':
        $ref: '../components/responses/errors.yaml#/ValidationError'
