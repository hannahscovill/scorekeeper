Game:
  type: object
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier for the game
      readOnly: true
    user_id:
      type: string
      format: uuid
      description: ID of the user who created the game
      readOnly: true
    game_id:
      type: string
      format: uuid
      description: ID of the game this belongs to
    team_id:
      type: string
      format: uuid
      description: ID of the team (if applicable)
    score:
      type: integer
      description: The numeric score value
    created_at:
      type: string
      format: date-time
      description: When the game was recorded
      readOnly: true
  required:
    - id
    - user_id
    - game_id
    - score
    - created_at

GameCreate:
  type: object
  properties:
    score:
      type: integer
      description: The numeric score value
    game_id:
      type: string
      format: uuid
      description: ID of the game (optional if context provides it)
  required:
    - score

GameCreateList:
  type: array
  items:
    $ref: '#/GameCreate'
  minItems: 1
  description: List of games to create

GameList:
  type: array
  items:
    $ref: '#/Game'
  description: List of games
