receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "https://wordles.dev"
            - "https://*.wordles.dev"
            - "http://localhost:*"
          allowed_headers:
            - "*"

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

  resource:
    attributes:
      - key: deployment.environment
        value: ${ENVIRONMENT}
        action: insert

  memory_limiter:
    check_interval: 1s
    limit_mib: 100
    spike_limit_mib: 50

exporters:
  otlphttp/grafana:
    endpoint: ${GRAFANA_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  basicauth/grafana:
    client_auth:
      username: ${GRAFANA_INSTANCE_ID}
      password: ${GRAFANA_API_KEY}

service:
  extensions: [health_check, basicauth/grafana]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/grafana]
