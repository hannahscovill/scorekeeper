services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    # command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    # volumes:
    #   - dynamodb-data:/data
    networks:
      - scorekeeper-network
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/localhost/8000) &>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      # - AWS_REGION=local
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    networks:
      - scorekeeper-network
    depends_on:
      dynamodb-local:
        condition: service_healthy

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-init
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init-dynamodb-local.sh"]
    networks:
      - scorekeeper-network
    depends_on:
      dynamodb-local:
        condition: service_healthy

  scorekeeper:
    build: .
    container_name: scorekeeper
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - JWT_SECRET=local-development-secret
      - BYPASS_AUTH=true
      - RUST_LOG=debug
      - TLS_ENABLED=true
      - TLS_CERT_PATH=/app/certs/cert.pem
      - TLS_KEY_PATH=/app/certs/key.pem
      - AWS_ENDPOINT_URL_DYNAMODB=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
      - DYNAMODB_TABLE_NAME=scorekeeper-games
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - scorekeeper-network
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

networks:
  scorekeeper-network:
    driver: bridge

volumes:
  dynamodb-data:
