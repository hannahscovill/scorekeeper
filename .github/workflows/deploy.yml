# Deploy Scorekeeper to AWS via CDK
#
# This workflow deploys the scorekeeper service to AWS ECS Fargate using CDK.
# It triggers after the CI workflow passes on the main branch.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
# ---------------------------------------------------------------------------------
# AWS_ACCOUNT_ID: Your AWS account ID (e.g., 123456789012)
# AWS_REGION: AWS region to deploy to (e.g., us-west-2)
# AWS_OIDC_ROLE_ARN: The ARN of the IAM role for GitHub OIDC authentication
#                    (e.g., arn:aws:iam::123456789012:role/GitHubActions-scorekeeper)
# AUTH0_M2M_SECRET_ARN: The ARN of the Secrets Manager secret containing Auth0 M2M credentials
#                       (e.g., arn:aws:secretsmanager:us-west-2:123456789012:secret:scorekeeper/auth0-m2m-xxxxx)
#                       The secret should contain JSON: {"clientId": "...", "clientSecret": "..."}
#
# WORDLES_GITHUB_APP_SECRET_ARN: The ARN of the Secrets Manager secret containing GitHub App credentials
#                         for the issue proxy (e.g., arn:aws:secretsmanager:us-west-2:...:secret:wordles/github-app-xxxxx)
#                         The secret should contain JSON: {"appId": "...", "installationId": "...", "privateKey": "..."}
#                         Optional - if not provided, /issues endpoint will be disabled
#
# OTEL_SECRETS_ARN: The ARN of the Secrets Manager secret containing Grafana Cloud credentials
#                   (e.g., arn:aws:secretsmanager:us-west-2:123456789012:secret:otel-collector/grafana-xxxxx)
#                   The secret should contain JSON:
#                   {
#                     "GRAFANA_OTLP_ENDPOINT": "https://otlp-gateway-prod-us-east-0.grafana.net/otlp",
#                     "GRAFANA_INSTANCE_ID": "123456",
#                     "GRAFANA_API_KEY": "glc_..."
#                   }
#                   Optional - if not provided, collector will use debug exporter only
#
# AWS OIDC Setup:
# ---------------
# 1. Create an OIDC identity provider in AWS IAM:
#    - Provider URL: https://token.actions.githubusercontent.com
#    - Audience: sts.amazonaws.com
#
# 2. Create an IAM role with the following trust policy:
#    {
#      "Version": "2012-10-17",
#      "Statement": [
#        {
#          "Effect": "Allow",
#          "Principal": {
#            "Federated": "arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com"
#          },
#          "Action": "sts:AssumeRoleWithWebIdentity",
#          "Condition": {
#            "StringEquals": {
#              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#            },
#            "StringLike": {
#              "token.actions.githubusercontent.com:sub": "repo:<ORG>/<REPO>:ref:refs/heads/main"
#            }
#          }
#        }
#      ]
#    }
#
# 3. Attach the following permissions to the role:
#    - AmazonEC2ContainerRegistryPowerUser (for ECR push)
#    - CloudFormation full access (for CDK deploy)
#    - ECS full access (for service updates)
#    - IAM limited access (for CDK to create/update roles)
#    - VPC/EC2 permissions (for CDK infrastructure)
#    - S3 access (for CDK assets bucket)

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      cdk_action:
        description: "The CDK action to take"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

# Prevent concurrent deployments
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: scorekeeper

jobs:
  deploy:
    # Only run if CI workflow succeeded (workflow_run triggers on 'completed', not 'success')
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      repository_uri: ${{ steps.get-outputs.outputs.repository_uri }}
    env:
      CDK_ACTION: ${{ inputs.cdk_action || 'deploy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Validate required secrets
        if: ${{ env.CDK_ACTION != 'destroy' }}
        run: |
          MISSING=()
          # Auth0 M2M (required for profile endpoints)
          if [[ -z "${{ secrets.AUTH0_M2M_SECRET_ARN }}" ]]; then
            MISSING+=("AUTH0_M2M_SECRET_ARN")
          fi
          # GitHub App (required for issue proxy)
          if [[ -z "${{ secrets.WORDLES_GITHUB_APP_SECRET_ARN }}" ]]; then
            MISSING+=("WORDLES_GITHUB_APP_SECRET_ARN")
          fi
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required GitHub Actions secrets: ${MISSING[*]}"
            echo "Configure them in Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi
          echo "All required secrets are configured."

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy Prerequisite Infrastructure stack
        working-directory: infra
        run: npx cdk ${{ env.CDK_ACTION }} ${{ env.CDK_ACTION == 'destroy' && '--force' || '' }} PrerequisiteInfraStack --require-approval never -c prerequisite=true
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Get stack outputs
        if: ${{ env.CDK_ACTION != 'destroy' }}
        id: get-outputs
        run: |
          REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name PrerequisiteInfraStack \
            --query 'Stacks[0].Outputs[?OutputKey==`EcrRepositoryUri`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "repository_uri=$REPO_URI" >> $GITHUB_OUTPUT
          echo "ECR Repository URI: $REPO_URI"

      # build-and-push:
      # If making workflows reusable/composite, cache these dependencies or add these steps back in
      #   needs: prerequisite-infra
      #   if: ${{ inputs.cdk_action != 'destroy' }}
      #   runs-on: ubuntu-latest
      #   permissions:
      #     id-token: write
      #     contents: read
      #   outputs:
      #     image_tag: ${{ steps.meta.outputs.sha_tag }}

      #   steps:
      #     - name: Checkout repository
      #       uses: actions/checkout@v4

      #     - name: Configure AWS credentials via OIDC
      #       uses: aws-actions/configure-aws-credentials@v4
      #       with:
      #         role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
      #         aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ env.CDK_ACTION != 'destroy' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata for Docker
        if: ${{ env.CDK_ACTION != 'destroy' }}
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha_tag=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "full_image=${ECR_REGISTRY}/${ECR_REPOSITORY}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: ${{ env.CDK_ACTION != 'destroy' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: ${{ env.CDK_ACTION != 'destroy' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.full_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Deploy
      # If making workflows reusable/composite, cache these dependencies or add these steps back in
      #   needs: build-and-push
      #   runs-on: ubuntu-latest
      #   permissions:
      #     id-token: write
      #     contents: read

      #   steps:
      # - name: Checkout repository
      #   uses: actions/checkout@v4

      # - name: Configure AWS credentials via OIDC
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
      #     aws-region: ${{ env.AWS_REGION }}

      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "20"
      #     cache: "npm"
      #     cache-dependency-path: infra/package-lock.json

      # - name: Install CDK dependencies
      #   working-directory: infra
      #   run: npm ci

      - name: Deploy CDK stack
        working-directory: infra
        run: |
          npx cdk ${{ env.CDK_ACTION }} ${{ env.CDK_ACTION == 'destroy' && ' --force' || '' }} \
            ScorekeeperStack \
            --require-approval never \
            -c auth0M2mSecretArn=${{ secrets.AUTH0_M2M_SECRET_ARN }} \
            ${{ secrets.OTEL_SECRETS_ARN && format('-c otelSecretsArn={0}', secrets.OTEL_SECRETS_ARN) || '' }} \
            ${{ secrets.WORDLES_GITHUB_APP_SECRET_ARN && format('-c githubAppSecretArn={0}', secrets.WORDLES_GITHUB_APP_SECRET_ARN) || '' }}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment
        if: ${{ env.CDK_ACTION != 'destroy' }}
        run: |
          aws ecs update-service \
            --cluster scorekeeper-cluster-prod \
            --service scorekeeper-service-prod \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment to stabilize
        if: ${{ env.CDK_ACTION != 'destroy' }}
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster scorekeeper-cluster-prod \
            --services scorekeeper-service-prod \
            --region ${{ env.AWS_REGION }}
          echo "Deployment complete!"
