# Deploy Scorekeeper to AWS via CDK
#
# This workflow deploys the scorekeeper service to AWS ECS Fargate using CDK.
# It triggers after the CI workflow passes on the main branch.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
# ---------------------------------------------------------------------------------
# AWS_ACCOUNT_ID: Your AWS account ID (e.g., 123456789012)
# AWS_REGION: AWS region to deploy to (e.g., us-west-2)
# AWS_OIDC_ROLE_ARN: The ARN of the IAM role for GitHub OIDC authentication
#                    (e.g., arn:aws:iam::123456789012:role/GitHubActions-scorekeeper)
#
# Required AWS Secrets Manager secrets (us-west-2):
# ---------------------------------------------------------------------------------
# wordles/scorekeeper/auth0-m2m              → { clientId, clientSecret }  (Auth0 M2M for profile endpoints)
# wordles/scorekeeper/github-app             → { appId, installationId, privateKey }  (GitHub App for issue proxy)
# wordles/scorekeeper/turnstyle-secret-key   → { secret-key }  (Cloudflare Turnstile CAPTCHA)
# wordles/scorekeeper/grafana-otel           → { GRAFANA_OTLP_ENDPOINT, GRAFANA_INSTANCE_ID, GRAFANA_API_KEY }
#
# AWS OIDC Setup:
# ---------------
# 1. Create an OIDC identity provider in AWS IAM:
#    - Provider URL: https://token.actions.githubusercontent.com
#    - Audience: sts.amazonaws.com
#
# 2. Create an IAM role with the following trust policy:
#    {
#      "Version": "2012-10-17",
#      "Statement": [
#        {
#          "Effect": "Allow",
#          "Principal": {
#            "Federated": "arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com"
#          },
#          "Action": "sts:AssumeRoleWithWebIdentity",
#          "Condition": {
#            "StringEquals": {
#              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#            },
#            "StringLike": {
#              "token.actions.githubusercontent.com:sub": "repo:<ORG>/<REPO>:ref:refs/heads/main"
#            }
#          }
#        }
#      ]
#    }
#
# 3. Attach the following permissions to the role:
#    - AmazonEC2ContainerRegistryPowerUser (for ECR push)
#    - CloudFormation full access (for CDK deploy)
#    - ECS full access (for service updates)
#    - IAM limited access (for CDK to create/update roles)
#    - VPC/EC2 permissions (for CDK infrastructure)
#    - S3 access (for CDK assets bucket)
#    - secretsmanager:GetSecretValue on wordles/scorekeeper/*

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      cdk_action:
        description: "The CDK action to take"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

# Prevent concurrent deployments
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    # Only run if CI workflow succeeded (workflow_run triggers on 'completed', not 'success')
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      repository_uri: ${{ steps.get-outputs.outputs.repository_uri }}
    env:
      CDK_ACTION: ${{ inputs.cdk_action || 'deploy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Fetch secret ARNs from Secrets Manager
        if: ${{ env.CDK_ACTION != 'destroy' }}
        run: |
          arn() { aws secretsmanager get-secret-value --secret-id "$1" --query ARN --output text 2>/dev/null || echo ""; }

          AUTH0_M2M_ARN=$(arn wordles/scorekeeper/auth0-m2m)
          GITHUB_APP_ARN=$(arn wordles/scorekeeper/github-app)
          TURNSTILE_ARN=$(arn wordles/scorekeeper/turnstyle-secret-key)
          OTEL_ARN=$(arn wordles/scorekeeper/grafana-otel)

          # All secrets are required
          MISSING=()
          [[ -z "$AUTH0_M2M_ARN" ]] && MISSING+=("wordles/scorekeeper/auth0-m2m")
          [[ -z "$GITHUB_APP_ARN" ]] && MISSING+=("wordles/scorekeeper/github-app")
          [[ -z "$TURNSTILE_ARN" ]] && MISSING+=("wordles/scorekeeper/turnstyle-secret-key")
          [[ -z "$OTEL_ARN" ]] && MISSING+=("wordles/scorekeeper/grafana-otel")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required Secrets Manager secrets: ${MISSING[*]}"
            exit 1
          fi

          echo "AUTH0_M2M_SECRET_ARN=$AUTH0_M2M_ARN" >> "$GITHUB_ENV"
          echo "GITHUB_APP_SECRET_ARN=$GITHUB_APP_ARN" >> "$GITHUB_ENV"
          echo "TURNSTILE_SECRET_ARN=$TURNSTILE_ARN" >> "$GITHUB_ENV"
          echo "OTEL_SECRETS_ARN=$OTEL_ARN" >> "$GITHUB_ENV"

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy Prerequisite Infrastructure stack
        working-directory: infra
        run: npx cdk ${{ env.CDK_ACTION }} ${{ env.CDK_ACTION == 'destroy' && '--force' || '' }} PrerequisiteInfraStack --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Get stack outputs
        if: ${{ env.CDK_ACTION != 'destroy' }}
        id: get-outputs
        run: |
          REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name PrerequisiteInfraStack \
            --query 'Stacks[0].Outputs[?OutputKey==`EcrRepositoryUri`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "repository_uri=$REPO_URI" >> $GITHUB_OUTPUT
          echo "sha_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "ECR Repository URI: $REPO_URI"

      - name: Login to Amazon ECR
        if: ${{ env.CDK_ACTION != 'destroy' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ env.CDK_ACTION != 'destroy' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: ${{ env.CDK_ACTION != 'destroy' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.get-outputs.outputs.repository_uri }}:${{ steps.get-outputs.outputs.sha_tag }}
            ${{ steps.get-outputs.outputs.repository_uri }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Deploy CDK stack
        working-directory: infra
        run: |
          npx cdk ${{ env.CDK_ACTION }} ${{ env.CDK_ACTION == 'destroy' && ' --force' || '' }} \
            ScorekeeperStack \
            --require-approval never \
            -c auth0M2mSecretArn=${{ env.AUTH0_M2M_SECRET_ARN }} \
            -c githubAppSecretArn=${{ env.GITHUB_APP_SECRET_ARN }} \
            -c turnstileSecretArn=${{ env.TURNSTILE_SECRET_ARN }} \
            -c otelSecretsArn=${{ env.OTEL_SECRETS_ARN }} \
            -c commitHash=${GITHUB_SHA::7}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment
        if: ${{ env.CDK_ACTION != 'destroy' }}
        run: |
          aws ecs update-service \
            --cluster scorekeeper-cluster-prod \
            --service scorekeeper-service-prod \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment to stabilize
        if: ${{ env.CDK_ACTION != 'destroy' }}
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster scorekeeper-cluster-prod \
            --services scorekeeper-service-prod \
            --region ${{ env.AWS_REGION }}
          echo "Deployment complete!"
