# Prerequisite Infrastructure for Scorekeeper
#
# This workflow deploys the prerequisite CDK stack that creates the ECR repository.
# It should be run once before the first deployment, and is idempotent
# (safe to run multiple times - CDK handles updates gracefully).
#
# Can be triggered manually or called by other workflows.

name: Prerequisite Infrastructure

on:
  workflow_dispatch:
    inputs:
      cdk_action:
        description: 'The CDK action to take'
        required: true
        default: 'destroy'
        type: choice
        options:
          - deploy
          - destroy
  workflow_call:
    inputs:
      cdk_action:
        description: 'The CDK action to take'
        required: false
        default: 'destroy'
        type: string
    outputs:
      ecr_repository_uri:
        description: "The URI of the ECR repository"
        value: ${{ jobs.deploy-prerequisite.outputs.repository_uri }}

env:
  AWS_REGION: us-west-2
  DEFAULT_CDK_ACTION: destroy

jobs:
  deploy-prerequisite:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      repository_uri: ${{ steps.get-outputs.outputs.repository_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy Prerequisite Infrastructure stack
        working-directory: infra
        run: npx cdk ${{ inputs.cdk_action || env.DEFAULT_CDK_ACTION }} ${{ (inputs.cdk_action || env.DEFAULT_CDK_ACTION) == 'destroy' && ' --force' || '' }} PrerequisiteInfraStack --require-approval never -c prerequisite=true
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Get stack outputs
        id: get-outputs
        run: |
          REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name PrerequisiteInfraStack \
            --query 'Stacks[0].Outputs[?OutputKey==`EcrRepositoryUri`].OutputValue' \
            --output text \
            --region $AWS_REGION)
          echo "repository_uri=$REPO_URI" >> $GITHUB_OUTPUT
          echo "ECR Repository URI: $REPO_URI"
