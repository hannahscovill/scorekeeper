name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/openapi/**"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @redocly/cli

      - name: Inline JSON examples
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const yaml = require('js-yaml');

            const examplesDir = 'docs/openapi/data-examples';
            const examples = yaml.load(fs.readFileSync(path.join(examplesDir, 'examples.yaml'), 'utf8'));

            for (const [name, example] of Object.entries(examples)) {
              if (example && example.value && example.value['\$ref']) {
                const jsonPath = example.value['\$ref'].replace('./', '');
                const jsonContent = JSON.parse(fs.readFileSync(path.join(examplesDir, jsonPath), 'utf8'));
                example.value = jsonContent;
              }
            }

            fs.writeFileSync(path.join(examplesDir, 'examples.yaml'), yaml.dump(examples, { lineWidth: -1, noRefs: true }));
            console.log('Inlined JSON examples into examples.yaml');
          "

      - name: Validate OpenAPI specs
        run: |
          redocly lint docs/openapi/openapi.yaml
          redocly lint docs/openapi/openapi-planned.yaml

      - name: Build docs site
        run: |
          mkdir -p docs-site/planned

          # Build current API docs
          redocly build-docs docs/openapi/openapi.yaml -o docs-site/index.html

          # Build planned API docs
          redocly build-docs docs/openapi/openapi-planned.yaml -o docs-site/planned/index.html

          # Bundle specs for download
          redocly bundle docs/openapi/openapi.yaml -o docs-site/openapi-bundled.yaml
          redocly bundle docs/openapi/openapi-planned.yaml -o docs-site/planned/openapi-planned-bundled.yaml

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
